# Ottoman CI (2026-11-04): every push to main builds the launcher and the OS image and pushes it to ghcr as
# :edge. A release (manual "Run workflow" or a tag release-*) also pushes :stable and an immutable date-sha tag,
# builds the netinstall ISO and attaches it to a GitHub Release. Images are ~1.7 GiB compressed; the ISO ~1.2 GB.
# Not yet proven on a hosted runner: see docs/DESIGN.md 4.13 for what has run where.
name: build
on:
  push:
    branches: [main]
    tags: ['release-*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
env:
  REG: ghcr.io/${{ github.repository_owner }}/ottoman
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the hosted runner has ~14 GB free; the image build needs ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the launcher (builder container, isolated load check)
        run: ./scripts/build-shell.sh
      - name: Build the OS image (DEV=0)
        run: DEV=0 ./scripts/build-image.sh localhost/ottoman:ci
      - name: Decide tags
        id: tags
        run: |
          REG=$(echo "$REG" | tr 'A-Z' 'a-z'); echo "reg=$REG" >> "$GITHUB_OUTPUT"
          TAG=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD); echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [[ "${{ github.ref }}" == refs/tags/release-* ]]; then echo "release=1" >> "$GITHUB_OUTPUT"; else echo "release=0" >> "$GITHUB_OUTPUT"; fi
      - name: Push :edge
        run: podman tag localhost/ottoman:ci "${{ steps.tags.outputs.reg }}:edge" && podman push "${{ steps.tags.outputs.reg }}:edge"
      - name: Push :stable and the immutable tag (release only)
        if: steps.tags.outputs.release == '1'
        run: |
          podman tag localhost/ottoman:ci "${{ steps.tags.outputs.reg }}:stable" "${{ steps.tags.outputs.reg }}:${{ steps.tags.outputs.tag }}"
          podman push "${{ steps.tags.outputs.reg }}:${{ steps.tags.outputs.tag }}" && podman push "${{ steps.tags.outputs.reg }}:stable"
      - name: Netinstall ISO (release only)
        if: steps.tags.outputs.release == '1'
        run: |
          sudo apt-get install -y -q xorriso mtools cpio >/dev/null
          IMAGE_REF="${{ steps.tags.outputs.reg }}:stable" ./scripts/make-netinst-iso.sh "build/ottoman-${{ steps.tags.outputs.tag }}-netinstall.iso"
          sha256sum "build/ottoman-${{ steps.tags.outputs.tag }}-netinstall.iso" > "build/ottoman-${{ steps.tags.outputs.tag }}-netinstall.iso.sha256"
      - name: GitHub Release (release only)
        if: steps.tags.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.tag }}
          name: Ottoman ${{ steps.tags.outputs.tag }}
          body: |
            Image: `${{ steps.tags.outputs.reg }}:${{ steps.tags.outputs.tag }}` (also `:stable`).
            Installer: the netinstall ISO below (boots, pulls the image from ghcr, installs unattended, reboots into first run). Needs a wired connection during the install.
          files: |
            build/ottoman-${{ steps.tags.outputs.tag }}-netinstall.iso
            build/ottoman-${{ steps.tags.outputs.tag }}-netinstall.iso.sha256
