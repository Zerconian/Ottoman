# bootc-image-builder customizations for DEV disks only. The image itself stays clean: this adds a
# login user with an SSH key and marks the build host's local registry as insecure so the VM can
# 'bootc switch' to freshly built images without another bib run. Never ship a disk built with this.
[[customizations.user]]
name = "zerc"
groups = ["wheel"]
key = "<dev-ssh-public-key>"

# Passwordless sudo so the dev loop (bootc switch, journalctl) works over ssh without a tty. Dev disks only.
[[customizations.files]]
path = "/etc/sudoers.d/50-ottoman-dev"
mode = "0440"
data = "zerc ALL=(ALL) NOPASSWD: ALL\n"

# The insecure dev-registry entry is baked into DEV=1 images (image/Containerfile), not added here.
