# /var is not shipped in a bootc image; these directories are recreated at boot.
# Lines are exactly what `bootc container lint` asked for on the first successful M1 build (2026-11-02).
d /var/lib/AccountsService 0775 root root - -
d /var/lib/AccountsService/icons 0775 root root - -
d /var/lib/AccountsService/users 0700 root root - -
d /var/lib/flatpak 0755 root root - -
d /var/lib/geoclue 0755 geoclue geoclue - -
# sysusers.d creates the user but never its home. Without this the session unit fails on WorkingDirectory
# (seen 2026-11-02 on the first VM boot: PAM session opened, unit result=failed, 2 s restart loop).
d /var/home 0755 root root - -
d /var/home/ottoman 0700 ottoman ottoman - -
# plymouth (bootc lint asked, 2026-11-03)
d /var/lib/plymouth 0755 root root - -
d /var/spool/plymouth 0755 root root - -
