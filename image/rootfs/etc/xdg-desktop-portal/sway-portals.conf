# Ottoman: Fedora's /usr/share/xdg-desktop-portal/sway-portals.conf maps Inhibit to "none" (xdg-desktop-portal-gtk's
# Inhibit needs gnome-session), so Plezy's wake lock and Flatpak browsers' "keep screen on" had nothing to talk to
# (measured 2026-11-05). The launcher serves org.freedesktop.impl.portal.Inhibit itself (ottoman.portal).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Inhibit=ottoman
