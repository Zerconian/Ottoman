# Ottoman boot health (M5). A deployment that fails the required checks GREENBOOT_MAX_BOOT_ATTEMPTS times is
# dropped: grub's boot counter runs out and greenboot asks bootc to roll back (proven on the VM 2026-11-03).
# The stock checks target ostree remotes, a hardware watchdog and rpm-ostree platforms, none of which this
# appliance has; the Ottoman check is in check/required.d/.
GREENBOOT_MAX_BOOT_ATTEMPTS=3
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "02_watchdog.sh" "01_update_platforms_check.sh")
