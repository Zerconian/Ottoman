# Ottoman boot health (M5). A deployment that fails the required checks GREENBOOT_MAX_BOOT_ATTEMPTS times is
# dropped by grub's boot counter and the previous deployment boots. The stock checks target ostree remotes and
# a hardware watchdog, neither of which this appliance has; the Ottoman check is in check/required.d/.
GREENBOOT_MAX_BOOT_ATTEMPTS=3
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "02_watchdog.sh")
